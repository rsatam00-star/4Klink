<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4klink - Watch Movies</title>
    <style>
        /* Base Styling based on your image layout */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #141414; /* Deep dark background */
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 4klink Header */
        header {
            background-color: #1a1a1a;
            width: 100%;
            text-align: center;
            padding: 15px 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: bold;
            color: #d78a76; /* Soft coral/orange matching your screenshot logo color */
            letter-spacing: 1px;
        }

        /* Search Bar styling matching your purple/grey layout element */
        .search-container {
            width: 90%;
            max-width: 500px;
            margin: 20px 0;
        }

        .search-bar {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            background-color: #4a455a; /* Muted slate purple color from layout */
            border: none;
            border-radius: 10px;
            color: #fff;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .search-bar::placeholder {
            color: #b0aec2;
        }

        /* Main Movie Container Feed */
        .movie-feed {
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 25px; /* Spaces between the movie blocks */
            margin-bottom: 40px;
        }

        /* Movie Card Design mimicking your structure */
        .movie-card {
            background-color: #222222; /* Slightly lighter gray box background */
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            text-decoration: none; /* Makes the whole card clickable */
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .movie-card:hover {
            transform: scale(1.01);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        }

        /* Image Placeholder styling */
        .poster-container {
            width: 100%;
            min-height: 250px;
            background-color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
        }

        .poster-container img {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            border-radius: 8px;
        }

        /* Border box container for title as seen in your layout */
        .title-box {
            width: 90%;
            margin-top: 20px;
            padding: 15px;
            border: 2px solid #555555; /* The grey frame around title text */
            border-radius: 6px;
            text-align: center;
            box-sizing: border-box;
        }

        .title-box h2 {
            margin: 0;
            font-size: 1.3rem;
            color: #a6a6a6; /* Muted gray text color */
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>4klink</h1>
    </header>

    <div class="search-container">
        <input type="text" class="search-bar" placeholder="Search here...">
    </div>

    <div class="movie-feed">

        <a href="YOUR_MOVIE_LINK_HERE_1" class="movie-card" target="_blank">
            <div class="poster-container">
                <img src="https://via.placeholder.com/400x500/2b2b2b/ffffff?text=movie+poster+here" alt="Movie Poster">
            </div>
            <div class="title-box">
                <h2>Movie Title 1</h2>
            </div>
        </a>

        <a href="YOUR_MOVIE_LINK_HERE_2" class="movie-card" target="_blank">
            <div class="poster-container">
                <img src="https://via.placeholder.com/400x500/2b2b2b/ffffff?text=movie+poster+here" alt="Movie Poster">
            </div>
            <div class="title-box">
                <h2>Movie Title 2</h2>
            </div>
        </a>

    </div>

</body>
</html>
