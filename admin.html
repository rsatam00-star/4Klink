<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4klink Admin - Direct Control</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-container {
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        h2.section-title {
            color: #d78a76;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.5rem;
            border-bottom: 2px solid #4a455a;
            padding-bottom: 8px;
        }

        .upload-section {
            background-color: #222222;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #4a455a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        label {
            font-size: 0.9rem;
            color: #b0aec2;
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #555;
            background-color: #333;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input[type="file"] {
            background-color: #2b2b2b;
            cursor: pointer;
        }

        button {
            padding: 12px;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-publish {
            width: 100%;
            background-color: #d78a76;
            color: #141414;
            margin-top: 20px;
        }

        .btn-publish:hover {
            background-color: #bfa392;
        }

        .btn-cancel {
            width: 100%;
            background-color: #555;
            color: #fff;
            margin-top: 10px;
            display: none;
        }

        #status-msg {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .management-section {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .movie-manager-card {
            background-color: #252525;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-left: 4px solid #4a455a;
        }

        .movie-preview-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .manager-thumb {
            width: 55px;
            height: 75px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #333;
        }

        .manager-text h4 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: #fff;
        }

        .manager-text p {
            margin: 0;
            font-size: 0.8rem;
            color: #888;
            word-break: break-all;
        }

        .action-button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn-edit {
            flex: 1;
            background-color: #4a455a;
            color: #fff;
            font-size: 0.9rem;
            padding: 8px;
        }

        .btn-delete {
            flex: 1;
            background-color: #b84a4a;
            color: #fff;
            font-size: 0.9rem;
            padding: 8px;
        }
    </style>
</head>
<body>

<div class="dashboard-container">

    <div class="upload-section">
        <h2 class="section-title" id="form-title">Section 1: Post Movie</h2>
        
        <label>Movie Title</label>
        <input type="text" id="movieTitle" placeholder="e.g., Spider-Man">
        
        <label id="file-input-label">Upload Poster Image</label>
        <input type="file" id="imageFile" accept="image/*">
        
        <label>Streaming / Watch Link</label>
        <input type="text" id="streamLink" placeholder="Paste your video URL here">
        
        <button id="main-submit-btn" class="btn-publish" onclick="processSubmission()">Publish to Website</button>
        <button id="cancel-edit-btn" class="btn-cancel" onclick="abortEditMode()">Cancel Edit</button>
        
        <div id="status-msg">Connecting to database...</div>
    </div>

    <div class="management-section">
        <h2 class="section-title">Section 2: Manage Posts (Edit/Delete)</h2>
        <div id="live-management-feed">Fetching your active list...</div>
    </div>

</div>

<script>
    // =============================================================
    // 🔐 LIVE REPOSITORY SETUP (SAFE FULL KEY)
    // =============================================================
    const MY_GH_REPO  = "rsatam00-star/4Klink"; 
    const TARGET_FILE = "movies.js"; 

    // Paste your full encoded text right here inside the quotes!
    const SAFE_ENCODED_TOKEN = "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";
    
    // Automatically decodes it whole into memory when the browser opens
    const MY_GH_TOKEN = atob(SAFE_ENCODED_TOKEN);
    // =============================================================

    let activeMoviesCatalog = [];
    let fileShaTrackingToken = "";
    let activeEditIndex = null; 
    let backupPosterString = ""; 

    window.onload = function() {
        fetchDataFromCloud();
    };

    async function fetchDataFromCloud() {
        const msgBox = document.getElementById('status-msg');
        const feedBox = document.getElementById('live-management-feed');
        const endpoint = `https://api.github.com/repos/${MY_GH_REPO}/contents/${TARGET_FILE}`;

        try {
            const response = await fetch(endpoint, { headers: { "Authorization": `token ${MY_GH_TOKEN}` }, cache: 'no-store' });
            if(!response.ok) throw new Error("Link error");

            const payload = await response.json();
            fileShaTrackingToken = payload.sha;
            const plainText = atob(payload.content);

            if(plainText.includes("movieFeedData = ")) {
                const cleanedJson = plainText.replace("const movieFeedData = ", "").replace(";", "");
                activeMoviesCatalog = JSON.parse(cleanedJson);
            }

            refreshManagementFeed();
            msgBox.innerText = "🟢 System online. Ready to post.";
            msgBox.style.color = "#4caf50";
        } catch (err) {
            msgBox.innerText = "❌ Connection Error. Check token configuration.";
            msgBox.style.color = "#b84a4a";
            feedBox.innerHTML = "<p style='color:#b84a4a; font-size:0.9rem;'>Unable to connect. Check your configuration values inside the script section.</p>";
        }
    }

    function refreshManagementFeed() {
        const feedBox = document.getElementById('live-management-feed');
        if (activeMoviesCatalog.length === 0) {
            feedBox.innerHTML = "<p style='color:#666; text-align:center;'>No active posts found.</p>";
            return;
        }

        feedBox.innerHTML = "";
        activeMoviesCatalog.forEach((item, idx) => {
            const row = document.createElement('div');
            row.className = 'movie-manager-card';
            row.innerHTML = `
                <div class="movie-preview-info">
                    <img class="manager-thumb" src="${item.poster}" alt="poster">
                    <div class="manager-text">
                        <h4>${item.title}</h4>
                        <p>${item.link.substring(0, 45)}...</p>
                    </div>
                </div>
                <div class="action-button-group">
                    <button class="btn-edit" onclick="triggerEditState(${idx})">Modify</button>
                    <button class="btn-delete" onclick="triggerDeleteAction(${idx})">Remove</button>
                </div>
            `;
            feedBox.appendChild(row);
        });
    }

    function readImageAsBase64(fileObj) {
        return new Promise((res) => {
            const reader = new FileReader();
            reader.readAsDataURL(fileObj);
            reader.onload = () => res(reader.result);
        });
    }

    async function processSubmission() {
        const titleVal = document.getElementById('movieTitle').value;
        const fileSelector = document.getElementById('imageFile');
        const linkVal = document.getElementById('streamLink').value;
        const msgBox = document.getElementById('status-msg');

        if(!titleVal || !linkVal) {
            msgBox.innerText = "⚠️ Error: Title and Link details are required.";
            msgBox.style.color = "orange";
            return;
        }

        msgBox.innerText = "Saving changes...";
        msgBox.style.color = "#aaa";

        let finalPoster = backupPosterString;

        if(fileSelector.files[0]) {
            finalPoster = await readImageAsBase64(fileSelector.files[0]);
        } else if (activeEditIndex === null) {
            msgBox.innerText = "⚠️ Error: Please upload an image file.";
            msgBox.style.color = "orange";
            return;
        }

        if(activeEditIndex !== null) {
            activeMoviesCatalog[activeEditIndex] = { title: titleVal, poster: finalPoster, link: linkVal };
        } else {
            activeMoviesCatalog.unshift({ title: titleVal, poster: finalPoster, link: linkVal });
        }

        await synchronizeWithGitHub();
    }

    function triggerEditState(idx) {
        activeEditIndex = idx;
        const dataRecord = activeMoviesCatalog[idx];

        document.getElementById('form-title').innerText = "Modify Post";
        document.getElementById('movieTitle').value = dataRecord.title;
        document.getElementById('streamLink').value = dataRecord.link;
        document.getElementById('main-submit-btn').innerText = "Save Modified Details";
        document.getElementById('file-input-label').innerText = "Update Image File (Leave blank to keep current)";
        document.getElementById('cancel-edit-btn').style.display = "block";
        
        backupPosterString = dataRecord.poster;
        document.getElementById('status-msg').innerText = `Modifying: "${dataRecord.title}"`;
        document.getElementById('status-msg').style.color = "orange";
    }

    function abortEditMode() {
        activeEditIndex = null;
        backupPosterString = "";
        document.getElementById('form-title').innerText = "Section 1: Post Movie";
        document.getElementById('movieTitle').value = "";
        document.getElementById('streamLink').value = "";
        document.getElementById('imageFile').value = "";
        document.getElementById('main-submit-btn').innerText = "Publish to Website";
        document.getElementById('file-input-label').innerText = "Upload Poster Image";
        document.getElementById('cancel-edit-btn').style.display = "none";
        document.getElementById('status-msg').innerText = "🟢 System online. Ready to post.";
        document.getElementById('status-msg').style.color = "#4caf50";
    }

    async function triggerDeleteAction(idx) {
        if(!confirm(`Delete "${activeMoviesCatalog[idx].title}"?`)) return;
        
        document.getElementById('status-msg').innerText = "Removing record...";
        activeMoviesCatalog.splice(idx, 1);
        
        if(activeEditIndex === idx) abortEditMode();
        await synchronizeWithGitHub();
    }

    async function synchronizeWithGitHub() {
        const msgBox = document.getElementById('status-msg');
        const uploadEndpoint = `https://api.github.com/repos/${MY_GH_REPO}/contents/${TARGET_FILE}`;
        const outputPayloadText = `const movieFeedData = ${JSON.stringify(activeMoviesCatalog, null, 4)};`;

        try {
            const deliveryPayload = await fetch(uploadEndpoint, {
                method: "PUT",
                headers: { "Authorization": `token ${MY_GH_TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: "Catalog modified via Encoded Full Key System",
                    content: btoa(unescape(encodeURIComponent(outputPayloadText))),
                    sha: fileShaTrackingToken
                })
            });

            if(deliveryPayload.ok) {
                const confirmationData = await deliveryPayload.json();
                fileShaTrackingToken = confirmationData.content.sha; 
                
                msgBox.innerText = "🎉 Update successful! Live shortly.";
                msgBox.style.color = "#4caf50";
                
                abortEditMode();
                refreshManagementFeed();
            } else {
                throw new Error("Rejected");
            }
        } catch (err) {
            msgBox.innerText = "❌ Sync Failed. Check cloud settings.";
            msgBox.style.color = "#b84a4a";
        }
    }
</script>
</body>
</html>
