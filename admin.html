<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4Klink Admin Panel (Cache Buster)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        .section-box {
            background-color: #222222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }
        h2 { text-align: center; color: #d78a76; margin-top: 0; }
        label { display: block; margin-top: 12px; color: #aaa; font-size: 0.9rem; }
        input[type="text"], input[type="file"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background-color: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #d78a76;
            color: #141414;
            border: none;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #ffc107;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .movie-item {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #444;
        }
        .movie-info { font-weight: bold; color: #fff; font-size: 0.95rem; }
        .action-btns { display: flex; gap: 8px; margin-top: 5px; }
        .edit-btn { background-color: #0288d1; color: white; padding: 6px; font-size: 0.85rem; border-radius: 4px; border:none; margin:0; width:50%; }
        .delete-btn { background-color: #d32f2f; color: white; padding: 6px; font-size: 0.85rem; border-radius: 4px; border:none; margin:0; width:50%; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="section-box">
        <h2>4Klink Authentication</h2>
        <label>GitHub Personal Access Token (ghp_...)</label>
        <input type="password" id="ghToken" placeholder="Paste your token here">
        <button onclick="connectToDatabase()" style="margin-top: 8px; background-color: #4caf50; color: white;">Connect Database</button>
        <div id="status">Status: Waiting for token connection...</div>
    </div>

    <div class="section-box">
        <h2>Section 1: Post Movie</h2>
        <label>Movie Title</label>
        <input type="text" id="movieTitle" placeholder="e.g., Movie Name">
        
        <label>Movie Poster Image</label>
        <input type="file" id="moviePoster" accept="image/*">
        
        <label>Watch / Link URL</label>
        <input type="text" id="movieLink" placeholder="https://...">
        
        <button onclick="saveMovie()">Publish to Website</button>
    </div>

    <div class="section-box">
        <h2>Section 2: Manage Posts (Edit/Delete)</h2>
        <div id="movie-list-container" style="color: #aaa; text-align: center; font-size: 0.9rem;">
            Connect your database above to manage existing active posts.
        </div>
    </div>
</div>

<script>
    const REPO = "rsatam00-star/4Klink";
    const FILE_PATH = "movies.js";
    
    let currentSha = "";
    let movieFeedData = [];

    async function connectToDatabase() {
        const token = document.getElementById("ghToken").value.trim();
        const statusDiv = document.getElementById("status");
        
        if (!token) {
            statusDiv.innerText = "⚠️ Please paste your token first!";
            statusDiv.style.color = "orange";
            return;
        }

        statusDiv.innerText = "Connecting...";
        statusDiv.style.color = "#ffc107";

        // Adding a randomized string to forcefully break any local cache files
        const uniqueId = new Date().getTime() + "_" + Math.random().toString(36).substring(2, 9);
        const url = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?nocache=${uniqueId}`;

        try {
            const response = await fetch(url, { 
                headers: { "Authorization": `token ${token}` },
                cache: 'no-store'
            });
            if (!response.ok) throw new Error(`Connection failed (Status ${response.status})`);

            const data = await response.json();
            currentSha = data.sha;
            
            // Safe clean conversion of character array data
            const cleanRawText = atob(data.content.replace(/[\s\n\r]/g, ''));
            
            if (cleanRawText.includes("movieFeedData=")) {
                const cleanJson = cleanRawText.replace("constmovieFeedData=", "").replace(";", "").trim();
                movieFeedData = JSON.parse(cleanJson);
            } else if (cleanRawText.includes("movieFeedData\s*=\s*")) {
                // Catch variant spacing formatting models
                const cleanJson = cleanRawText.split(/movieFeedData\s*=\s*/)[1].replace(";", "").trim();
                movieFeedData = JSON.parse(cleanJson);
            } else {
                movieFeedData = [];
            }

            statusDiv.innerText = `🟢 Connected! Found ${movieFeedData.length} active posts.`;
            statusDiv.style.color = "#4caf50";
            
            renderMovieList();

        } catch (err) {
            statusDiv.innerText = `❌ Error: ${err.message}. Check token or repository files.`;
            statusDiv.style.color = "#ff5252";
        }
    }

    function renderMovieList() {
        const container = document.getElementById("movie-list-container");
        if (movieFeedData.length === 0) {
            container.innerHTML = "No movies posted yet.";
            return;
        }

        container.innerHTML = "";
        movieFeedData.forEach((movie, index) => {
            const item = document.createElement("div");
            item.className = "movie-item";
            item.innerHTML = `
                <div class="movie-info">${movie.title}</div>
                <div style="font-size:0.75rem; color:#888; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${movie.link}</div>
                <div class="action-btns">
                    <button class="edit-btn" onclick="editPost(${index})">✏️ Edit</button>
                    <button class="delete-btn" onclick="deletePost(${index})">🗑️ Delete</button>
                </div>
            `;
            container.appendChild(item);
        });
    }

    function imageToBase64(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
        });
    }

    async function pushUpdateToGitHub(updatedData, logMessage) {
        const token = document.getElementById("ghToken").value.trim();
        const statusDiv = document.getElementById("status");
        
        statusDiv.innerText = "Syncing changes to GitHub...";
        statusDiv.style.color = "#ffc107";

        try {
            const updatedContentText = `const movieFeedData = ${JSON.stringify(updatedData, null, 4)};`;
            const base64EncodedPayload = btoa(unescape(encodeURIComponent(updatedContentText)));

            const url = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;
            const uploadResponse = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: logMessage,
                    content: base64EncodedPayload,
                    sha: currentSha
                })
            });

            if (uploadResponse.ok) {
                statusDiv.innerText = "🎉 Database updated successfully!";
                statusDiv.style.color = "#4caf50";
                
                const resData = await uploadResponse.json();
                currentSha = resData.content.sha;
                renderMovieList();
            } else {
                throw new Error("GitHub push write rejected.");
            }
        } catch (err) {
            statusDiv.innerText = `❌ Action Failed: ${err.message}`;
            statusDiv.style.color = "#ff5252";
        }
    }

    async function saveMovie() {
        const title = document.getElementById("movieTitle").value.trim();
        const link = document.getElementById("movieLink").value.trim();
        const fileInput = document.getElementById("moviePoster");
        const statusDiv = document.getElementById("status");

        if (!currentSha) {
            statusDiv.innerText = "⚠️ Make sure you hit 'Connect Database' successfully first!";
            statusDiv.style.color = "orange";
            return;
        }
        if (!title || !link || !fileInput.files[0]) {
            statusDiv.innerText = "⚠️ Fill out all fields and select a poster image.";
            statusDiv.style.color = "orange";
            return;
        }

        const base64Image = await imageToBase64(fileInput.files[0]);
        movieFeedData.unshift({ title: title, poster: base64Image, link: link });
        
        document.getElementById("movieTitle").value = "";
        document.getElementById("movieLink").value = "";
        fileInput.value = "";

        await pushUpdateToGitHub(movieFeedData, "Added new movie post");
    }

    async function editPost(index) {
        const targetMovie = movieFeedData[index];
        const newTitle = prompt("Edit Movie Title:", targetMovie.title);
        const newLink = prompt("Edit Watch Link URL:", targetMovie.link);

        if (newTitle === null || newLink === null) return;

        if (!newTitle.trim() || !newLink.trim()) {
            alert("Fields cannot be empty!");
            return;
        }

        movieFeedData[index].title = newTitle.trim();
        movieFeedData[index].link = newLink.trim();

        await pushUpdateToGitHub(movieFeedData, `Edited entry: ${newTitle}`);
    }

    async function deletePost(index) {
        const confirmDelete = confirm(`Are you sure you want to delete "${movieFeedData[index].title}"?`);
        if (!confirmDelete) return;

        movieFeedData.splice(index, 1);
        await pushUpdateToGitHub(movieFeedData, "Deleted movie post entry");
    }
</script>

</body>
</html>
