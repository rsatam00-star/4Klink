<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4klink Admin - Direct Control</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-container {
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        h2.section-title {
            color: #d78a76;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.5rem;
            border-bottom: 2px solid #4a455a;
            padding-bottom: 8px;
        }

        .upload-section {
            background-color: #222222;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #4a455a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        label {
            font-size: 0.9rem;
            color: #b0aec2;
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #555;
            background-color: #333;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        button {
            padding: 12px;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            background-color: #d78a76;
            color: #141414;
            margin-top: 20px;
        }

        #status-msg {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.4;
        }

        .management-section {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

<div class="dashboard-container">

    <div class="upload-section">
        <h2 class="section-title">Section 1: Post Movie</h2>
        
        <label>Movie Title</label>
        <input type="text" id="movieTitle" placeholder="e.g., Spider-Man">
        
        <label>Upload Poster Image</label>
        <input type="file" id="imageFile" accept="image/*">
        
        <label>Streaming / Watch Link</label>
        <input type="text" id="streamLink" placeholder="Paste your video URL here">
        
        <button onclick="processSubmission()">Publish to Website</button>
        
        <div id="status-msg">Connecting to database...</div>
    </div>

    <div class="management-section">
        <h2 class="section-title">Section 2: Manage Posts</h2>
        <div id="live-management-feed">Fetching your active list...</div>
    </div>

</div>

<script>
    // =============================================================
    // 🔐 LIVE REPOSITORY SETUP (SAFE FULL KEY)
    // =============================================================
    const MY_GH_REPO  = "rsatam00-star/4Klink"; // Double check spelling/casing of your username
    const TARGET_FILE = "movies.js"; 

    // 👈 Paste your complete scrambled Base64 string here inside the quotes:
    const SAFE_ENCODED_TOKEN = "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";
    
    const MY_GH_TOKEN = atob(SAFE_ENCODED_TOKEN).trim();
    // =============================================================

    let activeMoviesCatalog = [];
    let fileShaTrackingToken = "";

    window.onload = function() {
        fetchDataFromCloud();
    };

    async function fetchDataFromCloud() {
        const msgBox = document.getElementById('status-msg');
        const feedBox = document.getElementById('live-management-feed');
        const endpoint = `https://api.github.com/repos/${MY_GH_REPO}/contents/${TARGET_FILE}`;

        try {
            const response = await fetch(endpoint, { 
                headers: { "Authorization": `token ${MY_GH_TOKEN}` },
                cache: 'no-store' 
            });
            
            if(!response.ok) {
                if(response.status === 401 || response.status === 403) {
                    throw new Error("Bad Token (Expired or wrong permissions)");
                } else if(response.status === 404) {
                    throw new Error("Repository or movies.js file not found");
                } else {
                    throw new Error(`Server returned status: ${response.status}`);
                }
            }

            const payload = await response.json();
            fileShaTrackingToken = payload.sha;
            const plainText = atob(payload.content);

            if(plainText.includes("movieFeedData = ")) {
                const cleanedJson = plainText.replace("const movieFeedData = ", "").replace(";", "");
                activeMoviesCatalog = JSON.parse(cleanedJson);
            }

            feedBox.innerHTML = `<p style='color:#4caf50;'>Successfully loaded ${activeMoviesCatalog.length} movies.</p>`;
            msgBox.innerText = "🟢 System online. Ready to post.";
            msgBox.style.color = "#4caf50";
        } catch (err) {
            msgBox.innerHTML = `❌ Connection Error.<br><span style="color:#ff8888; font-size:0.8rem;">Reason: ${err.message}</span>`;
            msgBox.style.color = "#b84a4a";
            feedBox.innerHTML = `<p style='color:#b84a4a;'>Database locked. Error detail: ${err.message}</p>`;
        }
    }

    function readImageAsBase64(fileObj) {
        return new Promise((res) => {
            const reader = new FileReader();
            reader.readAsDataURL(fileObj);
            reader.onload = () => res(reader.result);
        });
    }

    async function processSubmission() {
        const titleVal = document.getElementById('movieTitle').value;
        const fileSelector = document.getElementById('imageFile');
        const linkVal = document.getElementById('streamLink').value;
        const msgBox = document.getElementById('status-msg');

        if(!titleVal || !linkVal || !fileSelector.files[0]) {
            msgBox.innerText = "⚠️ Error: Title, Link, and Image are required.";
            msgBox.style.color = "orange";
            return;
        }

        msgBox.innerText = "Saving changes...";
        msgBox.style.color = "#aaa";

        const finalPoster = await readImageAsBase64(fileSelector.files[0]);
        activeMoviesCatalog.unshift({ title: titleVal, poster: finalPoster, link: linkVal });

        const uploadEndpoint = `https://api.github.com/repos/${MY_GH_REPO}/contents/${TARGET_FILE}`;
        const outputPayloadText = `const movieFeedData = ${JSON.stringify(activeMoviesCatalog, null, 4)};`;

        try {
            const deliveryPayload = await fetch(uploadEndpoint, {
                method: "PUT",
                headers: { "Authorization": `token ${MY_GH_TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: "Catalog updated",
                    content: btoa(unescape(encodeURIComponent(outputPayloadText))),
                    sha: fileShaTrackingToken
                })
            });

            if(deliveryPayload.ok) {
                msgBox.innerText = "🎉 Update successful! Refreshing site...";
                msgBox.style.color = "#4caf50";
                setTimeout(() => { location.reload(); }, 1500);
            } else {
                throw new Error("Save rejected by GitHub");
            }
        } catch (err) {
            msgBox.innerText = `❌ Sync Failed: ${err.message}`;
            msgBox.style.color = "#b84a4a";
        }
    }
</script>
</body>
</html>
