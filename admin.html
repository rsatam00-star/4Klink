<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4Klink Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background-color: #222222;
            padding: 20px;
            border-radius: 10px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #d78a76; margin-top: 0; }
        label { display: block; margin-top: 12px; color: #aaa; font-size: 0.9rem; }
        input[type="text"], input[type="file"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background-color: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #d78a76;
            color: #141414;
            border: none;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #ffc107;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>4Klink Dashboard</h2>
    
    <label>GitHub Personal Access Token (ghp_...)</label>
    <input type="password" id="ghToken" placeholder="Paste your full token here">
    <button onclick="connectToDatabase()" style="margin-top: 8px; background-color: #4caf50; color: white;">Connect Database</button>
    
    <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">

    <label>Movie Title</label>
    <input type="text" id="movieTitle" placeholder="e.g., Movie Name">
    
    <label>Movie Poster Image</label>
    <input type="file" id="moviePoster" accept="image/*">
    
    <label>Watch / Link URL</label>
    <input type="text" id="movieLink" placeholder="https://...">
    
    <button onclick="saveMovie()">Publish to Website</button>
    
    <div id="status">Status: Waiting for token connection...</div>
</div>

<script>
    const REPO = "rsatam00-star/4Klink";
    const FILE_PATH = "movies.js";
    
    let currentSha = "";
    let movieFeedData = [];

    async function connectToDatabase() {
        const token = document.getElementById("ghToken").value.trim();
        const statusDiv = document.getElementById("status");
        
        if (!token) {
            statusDiv.innerText = "⚠️ Please paste your token first!";
            statusDiv.style.color = "orange";
            return;
        }

        statusDiv.innerText = "Connecting...";
        statusDiv.style.color = "#ffc107";

        // Adding timestamp to completely bypass phone memory cache bugs
        const url = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?t=${new Date().getTime()}`;

        try {
            const response = await fetch(url, {
                headers: { "Authorization": `token ${token}` }
            });

            if (!response.ok) {
                throw new Error(`Connection failed (Status ${response.status})`);
            }

            const data = await response.json();
            currentSha = data.sha;
            
            // Decode your movies.js file text safely
            const rawContent = atob(data.content.replace(/\s/g, ''));
            
            if (rawContent.includes("movieFeedData = ")) {
                const cleanJson = rawContent.replace("const movieFeedData = ", "").replace(";", "").trim();
                movieFeedData = JSON.parse(cleanJson);
            } else {
                movieFeedData = [];
            }

            statusDiv.innerText = `🟢 Connected! Found ${movieFeedData.length} active posts.`;
            statusDiv.style.color = "#4caf50";

        } catch (err) {
            statusDiv.innerText = `❌ Error: ${err.message}. Check token or repository files.`;
            statusDiv.style.color = "#ff5252";
        }
    }

    function imageToBase64(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
        });
    }

    async function saveMovie() {
        const token = document.getElementById("ghToken").value.trim();
        const title = document.getElementById("movieTitle").value.trim();
        const link = document.getElementById("movieLink").value.trim();
        const fileInput = document.getElementById("moviePoster");
        const statusDiv = document.getElementById("status");

        if (!currentSha || !token) {
            statusDiv.innerText = "⚠️ You must connect the database successfully first!";
            statusDiv.style.color = "orange";
            return;
        }

        if (!title || !link || !fileInput.files[0]) {
            statusDiv.innerText = "⚠️ Fill out all fields and select a poster image.";
            statusDiv.style.color = "orange";
            return;
        }

        statusDiv.innerText = "Uploading to website...";
        statusDiv.style.color = "#ffc107";

        try {
            const base64Image = await imageToBase64(fileInput.files[0]);
            
            // Add new post to the front of your data list
            movieFeedData.unshift({ title: title, poster: base64Image, link: link });
            
            const updatedContentText = `const movieFeedData = ${JSON.stringify(movieFeedData, null, 4)};`;
            const base64EncodedPayload = btoa(unescape(encodeURIComponent(updatedContentText)));

            const url = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;
            const uploadResponse = await fetch(url, {
                method: "PUT",
                headers: { 
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "Added new post via Admin Panel",
                    content: base64EncodedPayload,
                    sha: currentSha
                })
            });

            if (uploadResponse.ok) {
                statusDiv.innerText = "🎉 Movie Published Successfully! Refreshing list...";
                statusDiv.style.color = "#4caf50";
                
                // Clear fields for your next entry
                document.getElementById("movieTitle").value = "";
                document.getElementById("movieLink").value = "";
                fileInput.value = "";
                
                // Refresh data status
                setTimeout(connectToDatabase, 1500);
            } else {
                throw new Error("GitHub rejected the save update.");
            }

        } catch (err) {
            statusDiv.innerText = `❌ Upload Failed: ${err.message}`;
            statusDiv.style.color = "#ff5252";
        }
    }
</script>

</body>
</html>
